# 영문 독자(동료 연구자·심사자·검색)가 보는 한 줄. 모든 페이지의 meta description,
# OG 카드, 트위터 카드에 함께 나간다. 고치면 `npm run make-og` 를 다시 돌려야
# OG 이미지의 문구도 따라온다.
tagline: AI methods and software for multimodal biomedical data.

# 사이트 절대 URL. og:url·canonical·sitemap 의 기준이다.
#
# 같은 내용이 두 곳에서 서빙된다 — 학교 도메인(정본)과 GitHub Pages(예비).
# 여기 적힌 쪽이 정본이 되고, Pages 에서 나가는 canonical 도 이쪽을 가리킨다.
#
# http 인 이유: 교내 방화벽이 인바운드 443 을 막고 있다. 인증서는 발급됐고
# 교내에서는 https 가 열리지만, 외부에서는 닿지 않는다. canonical 과 og:image 가
# 밖에서 못 여는 주소를 가리키면 검색엔진도 링크 미리보기도 깨진다.
# 443 이 열리면 https 로 바꾸고 리다이렉트를 켠다 (deploy/ailab-mju.conf 참고).
site_url: http://ailab.mju.ac.kr

# 한국어를 두는 첫 번째 자리 — 홈 소개 문단
#
# 읽는 사람은 전산 전공 학생이다. 전사체·표현학습 같은 말로 시작하면
# 무슨 연구실인지 판단할 수가 없다.
#
# 두 문단을 넘기지 말 것. 기법이나 주제를 쉼표로 나열하면 키워드를 늘어놓은
# 것처럼 읽힌다 — 목록은 아래 Research 카드가 이미 하고 있다.
# 여기서는 무엇을 만드는지, 왜 기존 모델로 안 되는지, 예시 하나면 된다.
# 빈 줄이 문단을 나눈다.
intro_ko: |
  단일세포·공간 전사체 등 형태가 서로 다른 바이오메디컬 데이터를 분석하는
  AI·머신러닝 방법을 개발합니다.

  방법 개발에서 그치지 않고 연구자가 바로 사용할 수 있는 소프트웨어로 구현하며,
  병원 연구진과 협업해 환자 데이터에서 질병 기전을 밝히고 바이오마커를 발굴합니다.

# 한국어를 두는 두 번째 자리 — 모집 안내
#
# 홈 소개와 같은 이유로 쉬운 말로 쓴다. 지원 여부를 정하는 페이지라
# 여기서 막히면 위에서 읽은 게 소용없다.
recruiting_ko: |
  머신러닝으로 실제 데이터의 문제를 푸는 데 관심 있는
  석사과정, 박사과정, 학부연구생을 모집합니다.

  생물학 배경은 필요하지 않습니다. 필요한 생물학은 들어와서 배우면 되고,
  파이썬으로 모델을 짜 본 경험이 그보다 중요합니다.
recruiting_checklist_ko:
  - 간단한 자기소개 또는 CV
  - 관심 있는 연구 주제 한두 문장
  - 프로그래밍 경험
  - 가능한 시작 시기

