# 한국어를 두는 첫 번째 자리 — 홈 소개 문단
#
# 읽는 사람은 전산 전공 학생이다. 전사체·표현학습 같은 말로 시작하면
# 무슨 연구실인지 판단할 수가 없다.
#
# 두 문단을 넘기지 말 것. 기법이나 주제를 쉼표로 나열하면 키워드를 늘어놓은
# 것처럼 읽힌다 — 목록은 아래 Research 카드가 이미 하고 있다.
# 여기서는 무엇을 만드는지, 왜 기존 모델로 안 되는지, 예시 하나면 된다.
# 빈 줄이 문단을 나눈다.
intro_ko: |
  생명·의료 데이터를 위한 머신러닝 모델을 직접 설계합니다.
  표와 이미지와 그래프가 한 문제 안에 섞여 들어오는 데이터라,
  기존 모델을 그대로 가져다 쓰기 어렵습니다.

  이를테면 조직 사진만 보고 그 안의 유전자 발현량을 예측하거나,
  암세포가 어떤 약에 반응할지 미리 맞히는 문제를 풉니다.

# 한국어를 두는 두 번째 자리 — 모집 안내
#
# 홈 소개와 같은 이유로 쉬운 말로 쓴다. 지원 여부를 정하는 페이지라
# 여기서 막히면 위에서 읽은 게 소용없다.
recruiting_ko: |
  머신러닝으로 실제 데이터의 문제를 푸는 데 관심 있는
  석사과정, 박사과정, 학부연구생을 모집합니다.

  생물학 배경은 필요하지 않습니다. 필요한 생물학은 들어와서 배우면 되고,
  파이썬으로 모델을 짜 본 경험이 그보다 중요합니다.
recruiting_checklist_ko:
  - 간단한 자기소개 또는 CV
  - 관심 있는 연구 주제 한두 문장
  - 프로그래밍 경험
  - 가능한 시작 시기
recruiting_reply_ko: 보통 3일 안에 답장드립니다.

