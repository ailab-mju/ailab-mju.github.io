# 한국어를 두는 첫 번째 자리 — 홈 소개 문단
intro_ko: |
  단일세포 전사체와 공간 전사체 데이터를 위한 기계학습 방법론을 연구합니다.
  세포 표현학습, 세포 유형 주석, 공간 발현 예측, 약물 반응 모델링을 다룹니다.

# 한국어를 두는 두 번째 자리 — 모집 안내
recruiting_ko: |
  단일세포·공간 전사체 데이터에 기계학습을 적용하는 연구에 관심 있는
  석사과정, 박사과정, 학부연구생을 모집합니다. 생물학 배경은 필수가 아닙니다.
recruiting_checklist_ko:
  - 간단한 자기소개 또는 CV
  - 관심 있는 연구 주제 한두 문장
  - 프로그래밍 경험
  - 가능한 시작 시기
recruiting_reply_ko: 보통 3일 안에 답장드립니다.

