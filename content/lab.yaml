# 한국어를 두는 첫 번째 자리 — 홈 소개 문단
#
# 읽는 사람은 전산 전공 학생이다. 전사체·표현학습 같은 말로 시작하면
# 무슨 연구실인지 판단할 수가 없다. 아는 단어(모델·어텐션·그래프)로 시작해서
# 데이터가 무엇인지, 어떤 문제를 푸는지 순서로 내려간다.
# 빈 줄이 문단을 나눈다.
intro_ko: |
  머신러닝 모델을 직접 설계하는 연구실입니다.
  그래프 신경망, 어텐션, 오토인코더, 대규모 언어모델을 생명·의료 데이터의
  구조에 맞게 고쳐 쓰거나 새로 만듭니다.

  이 데이터는 표·이미지·그래프·텍스트가 한 문제 안에 섞여 들어옵니다.
  세포 하나하나를 따로 측정한 값, 조직 사진 위의 위치 정보,
  유전자들이 서로를 조절하는 관계망, 그리고 논문 텍스트가 함께 쓰입니다.

  푸는 문제는 이런 것들입니다 — 세포 종류 자동 분류, 조직 사진만 보고
  유전자 발현량 예측, 암세포가 어떤 약에 반응할지 예측,
  환자마다 다른 유전자 조절 네트워크 찾기.

# 한국어를 두는 두 번째 자리 — 모집 안내
#
# 홈 소개와 같은 이유로 쉬운 말로 쓴다. 지원 여부를 정하는 페이지라
# 여기서 막히면 위에서 읽은 게 소용없다.
recruiting_ko: |
  머신러닝으로 실제 데이터의 문제를 푸는 데 관심 있는
  석사과정, 박사과정, 학부연구생을 모집합니다.

  생물학 배경은 필요하지 않습니다. 필요한 생물학은 들어와서 배우면 되고,
  파이썬으로 모델을 짜 본 경험이 그보다 중요합니다.
recruiting_checklist_ko:
  - 간단한 자기소개 또는 CV
  - 관심 있는 연구 주제 한두 문장
  - 프로그래밍 경험
  - 가능한 시작 시기
recruiting_reply_ko: 보통 3일 안에 답장드립니다.

