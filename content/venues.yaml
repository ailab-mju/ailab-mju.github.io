# 저널·학회 정보. publications.yaml 의 venue 문자열이 여기 name 과 정확히 일치해야 한다.
#
# IF 는 논문이 아니라 저널의 속성이고 매년 바뀐다. 여기서 한 번 고치면
# 그 저널의 모든 논문에 반영된다 — 논문마다 IF 를 적지 말 것.
#
#   scope: international | domestic
#   kind:  journal | conference
#   scie:  true | false | (비움 = 미확인 → 사이트에 "SCIE 미확인"으로 집계된다)
#   impact_factor: JIF 값. 화면에는 연도 없이 "IF 7.3" 으로만 나간다.
#   jcr_year:      값의 출처 연도. 화면에 나가지 않지만 갱신 시점을 알기 위해 남긴다.
#   quartile:      best ranking 카테고리 기준. JIF percentile 75% 이상이면 Q1.
#                  화면에는 내보내지 않는다 — IF 옆에 분위까지 붙으면 줄이 지저분해진다.
#   source:        그 값을 어디서 봤는지. 반드시 남긴다.
#
# 아래 값은 전부 JCR 2025 (2026년 6월 Clarivate 공개) 기준으로 한 번에 맞췄다.
# 서로 다른 연도의 IF 를 섞지 말 것 — 같은 목록 안에서 비교가 어긋난다.
#
# 출판사 공식 페이지(OUP, Frontiers)에서 직접 확인한 값과
# wos-journal.info 의 값이 네 저널 모두 일치해 후자를 나머지 저널의 출처로 썼다.
# Springer Nature·Elsevier·MDPI 는 자동 조회를 차단해 공식 페이지를 읽을 수 없었다.
# 갱신할 때는 JCR(Clarivate) 직접 접속이 가장 정확하다 — 학교 도서관 → JCR → 저널명 검색.

