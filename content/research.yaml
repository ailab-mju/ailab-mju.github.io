# 연구 주제. key 는 publications.yaml 의 topics 와 이어진다 —
# 각 주제에 속한 논문 목록·편수·연도 범위는 빌드 타임에 파생되므로 여기 적지 않는다.
# 순서가 곧 화면 표시 순서이고, 홈에는 앞에서 3개만 나간다.

areas:
  - key: single-cell
    title: Single-cell representation learning
    summary: >-
      We learn representations of cells from scRNA-seq data so that clustering,
      cell type annotation, and batch effect correction can be addressed
      together rather than as separate steps. Recent work pairs a dual-encoder
      cross-attention architecture with large language models for annotation.
    tags:
      - cross-attention
      - dual encoder
      - cell type annotation
      - large language models

  - key: spatial
    title: Spatial transcriptomics
    summary: >-
      We work with transcriptomes measured alongside positional information in
      tissue: predicting expression from histology images, imputing unmeasured
      spots, and identifying spatial domains.
    tags:
      - histology
      - gene imputation
      - spatial domain
      - multimodal

  - key: multi-omics
    title: Multi-omics integration for drug response and phenotype
    summary: >-
      We integrate transcriptome, methylome, and other omics layers to explain
      how cells respond to drug treatment and how patient phenotypes differ,
      using autoencoders, tensor decomposition, and graph attention networks.
    tags:
      - drug response
      - graph attention network
      - autoencoder
      - tensor decomposition
      - biomarker discovery

  - key: networks
    title: Condition-specific regulatory networks
    summary: >-
      We reconstruct gene regulatory relationships that hold under a specific
      condition rather than on average — through transcription factor network
      propagation, kernel canonical correlation analysis, Gaussian process
      models for time-series data, and literature mining for miRNA-mRNA targets.
    tags:
      - network propagation
      - kernel CCA
      - Gaussian process
      - time-series
      - miRNA-mRNA
      - literature mining

  - key: methods
    title: Machine learning methods for biological data
    summary: >-
      Method development that is not tied to a single omics modality:
      alignment-free protein family modeling with convolutional networks,
      hierarchical clustering for arbitrary-shaped data, and algorithms for
      quantifying genome editing outcomes.
    tags:
      - convolutional networks
      - alignment-free
      - hierarchical clustering
      - genome editing

