# 목록 기준: Google Scholar 프로필 (nTDBvrkAAAAJ). 게재된 것만 싣는다 —
# bioRxiv 프리프린트 "Detailed mechanisms for unintended large DNA deletions"(2024)는
# Nature Biomedical Engineering 논문의 프리프린트라 중복이므로 제외했다.
#
# 저자·게재일·DOI 는 Crossref 로 확인했다.
# 연도는 date 에서 파생한다. year 필드를 따로 두지 말 것.
# 저자명 "Minsik Oh"는 렌더링 시 자동으로 굵게 처리된다. 하드코딩 금지.
#
# venue 는 content/venues.yaml 의 name 과 정확히 일치해야 한다.
# 국내/해외 · 저널/컨퍼런스 구분과 SCIE·IF 표기는 전부 거기서 파생된다 —
# 여기에 적지 말 것.
#
# topics 는 content/research.yaml 의 areas[].key 와 이어진다.
#
# 국내 학회 논문 제목은 원문(한국어) 그대로 쓴다. 번역하면 인용이 어긋난다.
# 한국정보과학회 학술발표논문집 항목은 RISS 로 확인했다 (저자: 오민식, 명지대).
# 개최월까지만 알 수 있어 날짜는 그 달 1일로 적었다.
# 이 논문들의 corresponding 은 지도교수이자 마지막 저자라는 근거로 적었다 —
# 논문집 표기와 대조해 확정할 것.
#
# first / corresponding — 1저자(†)·교신저자(*) 표기.
#   first 는 공동1저자일 때만 적는다. 비우면 authors 의 첫 사람이 1저자다.
#   corresponding 은 논문에 표기된 교신저자 전원. 순서는 상관없다.
#   두 필드의 이름은 authors 안의 표기와 글자까지 같아야 한다 —
#   어긋나면 마크가 조용히 사라지므로 빌드가 "저자 표기 불일치"로 센다.
#   확인 출처: Europe PMC 전문 XML(author-notes) · OpenAlex is_corresponding ·
#   저널 홈페이지. 컨퍼런스 논문은 교신저자 지정이 없는 경우가 많다.

