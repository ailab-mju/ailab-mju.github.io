# 사이트 빌드·배포. 크론이 없다 — push 될 때만 돈다.
# 60일 무활동 자동 비활성화 규칙은 스케줄 워크플로에만 적용되므로 이 워크플로는 꺼지지 않는다.
name: Deploy

on:
  push:
    branches: [main]

  # 갤러리 워크플로가 사진을 커밋해도 그 push 로는 이 워크플로가 돌지 않는다 —
  # GITHUB_TOKEN 으로 만든 push 는 재귀 실행을 막기 위해 이벤트를 발생시키지 않는다.
  # 이 줄이 없으면 학생이 사진을 올려도 사이트는 다음 사람 손 push 까지 그대로다.
  workflow_run:
    workflows: [Process gallery uploads]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 갤러리 워크플로가 실패했다면 이어붙이지 않는다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # ref 를 지정하지 않는다. workflow_run 의 head_sha 는 갤러리 워크플로를 *촉발한*
      # 커밋이라 정작 사진 커밋이 빠진다. 기본값(기본 브랜치 최신)이 맞다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 푸터의 "Last updated"를 최종 커밋 날짜로 고정한다.
      # 빌드 시각을 쓰면 재배포만 해도 날짜가 갱신되어 낡음이 가려진다.
      - name: Derive build date from last commit
        run: echo "BUILD_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"

      # 조직 사이트 저장소(<org>.github.io)는 루트로, 그 밖의 저장소는
      # <org>.github.io/<repo>/ 라는 하위 경로로 서빙된다.
      # 저장소 이름에서 파생하면 임시 저장소에서도 링크·이미지가 깨지지 않고,
      # 정식 저장소로 옮길 때 고칠 설정이 없다. 값을 손으로 적지 말 것.
      - name: Derive base path from repository name
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          # 커스텀 도메인(CNAME)이 붙어 있으면 저장소 이름과 무관하게 루트로 서빙된다.
          if [[ "$repo" == *.github.io ]] || [ -f CNAME ]; then
            echo "루트로 서빙 — basePath 없음"
          else
            echo "하위 경로로 서빙 — basePath=/$repo"
            echo "PREVIEW_BASE_PATH=/$repo" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      # 커스텀 도메인이 설정되어 있으면 CNAME이 저장소 루트에 생긴다.
      # out/ 이 사이트를 통째로 대체하므로 반드시 함께 복사한다.
      - name: Preserve CNAME
        run: |
          if [ -f CNAME ]; then
            cp CNAME out/CNAME
            echo "CNAME preserved: $(cat CNAME)"
          else
            echo "No CNAME file — serving on the github.io domain."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
