<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artificial Intelligence and Data Analytics Lab · Myongji University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#151320;
  --paper:#f5f4f7;
  --card:#ffffff;
  --line:#e0dee6;
  --mute:#6d6980;
  --deep:#3b1d52;
  --teal:#1f7f7a;
  --disp:"Archivo","Pretendard Variable",sans-serif;
  --body:"Pretendard Variable","Archivo",sans-serif;
  --mono:"JetBrains Mono",monospace;
  --w:1080px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.w{max-width:var(--w);margin:0 auto;padding:0 26px}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;line-height:1.18;margin:0}
p{margin:0 0 16px}

/* ---------- nav ---------- */
.nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav-in{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--disp);font-weight:800;font-size:16px}
.brand svg{width:22px;height:22px;flex:none}
.nav-links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav-links a{
  font-size:14px;text-decoration:none;color:var(--mute);padding:7px 12px;border-radius:5px;transition:.15s;
}
.nav-links a:hover{color:var(--ink);background:var(--paper)}
.nav-links a.on{color:var(--ink);font-weight:600}

/* ---------- page header ---------- */
.hd{padding:56px 0 44px;border-bottom:1px solid var(--line)}
.hd .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.hd h1{font-size:clamp(28px,4vw,42px)}
.hd h2{font-size:clamp(26px,3.6vw,36px)}
.hd .lede{margin:18px 0 0;color:#3f3b4e;max-width:60ch;font-size:16.5px}
.hd .cta{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap}
.btn{
  display:inline-block;text-decoration:none;font-size:14px;font-weight:600;
  padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--card);transition:.15s;
}
.btn:hover{border-color:#c6c1d3}
.btn-p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-p:hover{background:#282338;border-color:#282338}

/* ---------- hero slot (나중에 채울 자리) ---------- */
.slot{
  margin:34px 0 0;border:1px dashed #c9c4d6;border-radius:10px;background:var(--card);
  min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
}
.slot p{margin:0;color:#9a95a9;font-size:13.5px;line-height:1.8}
.slot .t{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b0aabf;display:block;margin-bottom:8px}

/* ---------- sections ---------- */
.sec{padding:52px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.link{font-size:14px;color:var(--teal);text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:22px}
.card h3{font-size:17px;margin-bottom:9px}
.card p{font-size:14px;color:var(--mute);margin:0;line-height:1.68}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--mute)}

/* ---------- publications ---------- */
.pub{padding:18px 0;border-bottom:1px solid var(--line)}
.pub:first-of-type{border-top:1px solid var(--line)}
.pub-t{font-family:var(--disp);font-size:16.5px;font-weight:600;line-height:1.45;text-decoration:none;display:block}
.pub-t:hover{color:var(--teal)}
.pub-a{font-size:13.5px;color:var(--mute);margin:6px 0 0;line-height:1.6}
.pub-a b{color:var(--ink);font-weight:600}
.pub-m{display:flex;gap:9px;align-items:center;margin-top:7px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.pub-v{color:var(--deep);font-weight:600}
.flag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:#f1eef5;color:var(--deep)}
.flag.todo{background:#fbe9e9;color:#9d3838}
.yr-h{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mute);margin:30px 0 0}
.yr-h:first-of-type{margin-top:0}

/* ---------- tools ---------- */
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.q{flex:1;min-width:200px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 13px;font-family:var(--body);font-size:14.5px;color:var(--ink)}
.q::placeholder{color:#a5a0b2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13.5px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 14px;color:var(--mute);transition:.15s}
.chips button:hover{border-color:#c6c1d3;color:var(--ink)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.count{font-size:13.5px;color:var(--mute);margin:0 0 18px}

/* ---------- members ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:18px;text-align:center}
.face{width:76px;height:76px;border-radius:50%;margin:0 auto 13px;background:#eceaf1;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:24px;font-weight:700;color:#9a95a9}
.person-n{font-family:var(--disp);font-size:15.5px;font-weight:700}
.person-e{font-size:13px;color:var(--mute)}
.person-r{font-size:13px;color:var(--teal);margin-top:7px;font-weight:600}
.person-t{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5}
.person-l{display:flex;gap:8px;justify-content:center;margin-top:11px;flex-wrap:wrap}
.person-l a{font-size:12px;color:var(--teal);text-decoration:none}
.person-l a:hover{text-decoration:underline}
.pi{display:grid;grid-template-columns:120px 1fr;gap:26px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;margin-bottom:32px;align-items:center}
.pi .face{margin:0;width:120px;height:120px;font-size:36px}

/* ---------- gallery ---------- */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.album{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;padding:0;text-align:left;color:inherit;transition:.15s}
.album:hover{border-color:#c6c1d3}
.album-i{aspect-ratio:4/3;background:#eceaf1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#b0aabf;letter-spacing:.1em}
.album-m{padding:14px 15px 16px}
.album-d{font-size:12.5px;color:var(--mute)}
.album-t{font-family:var(--disp);font-size:15.5px;font-weight:700;margin-top:4px}
.album-c{font-size:13px;color:var(--mute);margin-top:3px}
.lb{position:fixed;inset:0;background:rgba(21,19,32,.94);z-index:200;display:none;flex-direction:column;padding:20px}
.lb.on{display:flex}
.lb-t{display:flex;justify-content:space-between;align-items:center;color:#efeef4;gap:16px}
.lb-t h3{font-size:17px;margin:0}
.lb-t p{font-size:13px;color:#9a95ad;margin:2px 0 0}
.lb-x{background:none;border:1px solid #3d3757;color:#efeef4;border-radius:6px;width:34px;height:34px;font-size:17px;flex:none}
.lb-s{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px 0}
.lb-s>div{width:min(100%,740px);aspect-ratio:3/2;border-radius:8px;background:#2b2640;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:#6f6a88}
.lb-r{display:flex;gap:7px;overflow-x:auto}
.lb-r button{width:72px;height:52px;border-radius:5px;border:2px solid transparent;background:#2b2640;flex:none;padding:0;font-family:var(--mono);font-size:10px;color:#6f6a88}
.lb-r button.on{border-color:#8b86a3}

/* ---------- rows ---------- */
.row{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.row:first-of-type{border-top:1px solid var(--line)}
.row-d{font-size:14px;color:var(--mute)}
.row-t{font-family:var(--disp);font-size:16.5px;font-weight:600}
.row-b{font-size:14px;color:var(--mute);margin-top:4px}

/* ---------- join ---------- */
.join{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:34px;display:grid;grid-template-columns:1.25fr 1fr;gap:36px}
.join h2{font-size:23px}
.join p{font-size:15px;color:var(--mute)}
.join ol{margin:10px 0 0;padding-left:19px;color:var(--mute);font-size:14.5px;line-height:1.95}

/* ---------- misc ---------- */
.note{background:#fff8e6;border:1px solid #ecdca8;border-radius:7px;padding:12px 15px;font-size:13.5px;color:#6b5a1a;margin-bottom:22px;line-height:1.65}
.empty{border:1px dashed var(--line);border-radius:8px;padding:32px;text-align:center;color:var(--mute);font-size:14px;grid-column:1/-1}
.page{display:none}
.page.on{display:block}
.foot{background:var(--card);border-top:1px solid var(--line);padding:30px 0 42px;font-size:13.5px;color:var(--mute);margin-top:0}
.foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot a{color:var(--teal);text-decoration:none}

@media (max-width:860px){
  .nav-in{height:auto;padding:11px 0;flex-wrap:wrap;gap:10px}
  .nav-links{margin-left:0;width:100%}
  .join{grid-template-columns:1fr;padding:26px}
  .pi{grid-template-columns:1fr;justify-items:center;text-align:center}
  .row{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function pubs(){

      <div class="note"><b>Mockup note</b> — the three 2025&ndash;2026 entries are placeholders. Replace with real titles, authors, and DOIs.</div>

          <button data-t="conference">Conference</button><button data-t="preprint">Preprint</button>

        <button class="on" data-y="all">All years</button>${yrs.map(y=>`<button data-y="${y}">${y}</button>`).join("")}

}
function renderPubs(){
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  const t=document.querySelector("#fT .on").dataset.t;
  const y=document.querySelector("#fY .on").dataset.y;
  const hit=PUBS.filter(p=>(t==="all"||p.type===t)&&(y==="all"||String(p.y)===y)&&
    (!q||(p.t+" "+p.a.join(" ")+" "+p.v).toLowerCase().includes(q)));
  document.getElementById("pn").textContent=`${hit.length} publication${hit.length===1?"":"s"}`;
  const by={}; hit.forEach(p=>(by[p.y] ||= []).push(p));
  const out=Object.keys(by).sort((a,b)=>b-a).map(y=>
    `<div class="yr-h">${y}</div>${by[y].map(pubRow).join("")}`).join("");
  document.getElementById("pl").innerHTML=out||`<div class="empty">No publications match these filters. Try a different search term or year.</div>`;
}

/* ============================== ROUTER ============================== */
const R=[["/","Home",home],["/research","Research",research],["/publications","Publications",pubs],
 ["/members","Members",members],["/gallery","Gallery",gallery],["/news","News",news],
 ["/teaching","Teaching",teaching],["/join","Join",join]];
document.getElementById("nav").innerHTML=R.map(([p,l])=>`<a href="#${p}" data-p="${p}">${l}</a>`).join("");

function route(){
  const path=location.hash.replace(/^#/,"")||"/";
  const r=R.find(x=>x[0]===path)||R[0];
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===r[0]));
  document.getElementById("app").innerHTML=`<div class="page on">${r[2]()}</div>`;
  window.scrollTo(0,0);
  if(path==="/publications"){
    document.getElementById("q").addEventListener("input",renderPubs);
    ["fT","fY"].forEach(id=>document.getElementById(id).addEventListener("click",e=>{
      if(e.target.tagName!=="BUTTON")return;
      document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove("on"));
      e.target.classList.add("on"); renderPubs();
    }));
    renderPubs();
  }
  if(path==="/members"){
    document.getElementById("tab").addEventListener("click",e=>{
      if(e.target.tagName!=="BUTTON")return;
      document.querySelectorAll("#tab button").forEach(x=>x.classList.remove("on"));
      e.target.classList.add("on"); renderMembers();
    });
    renderMembers();
  }
  if(path==="/gallery"){
    document.querySelectorAll(".album").forEach(b=>b.addEventListener("click",()=>openLb(b.dataset.a)));
  }
}

let A=null,I=0;
function openLb(id){
  A=ALBUMS.find(x=>x.id===id); I=0;
  document.getElementById("lbT").textContent=A.t;
  document.getElementById("lbD").textContent=`${A.d} · ${A.c}`;
  document.getElementById("lbR").innerHTML=Array.from({length:A.n},(_,i)=>
    `<button data-i="${i}" class="${i?'':'on'}">${i+1}</button>`).join("");
  document.querySelectorAll("#lbR button").forEach(b=>b.addEventListener("click",()=>setLb(+b.dataset.i)));
  setLb(0);
  document.getElementById("lb").classList.add("on");
  document.body.style.overflow="hidden";
}
function setLb(i){
  I=i; document.getElementById("lbS").textContent=`Photo ${i+1} of ${A.n}`;
  document.querySelectorAll("#lbR button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
}
function closeLb(){document.getElementById("lb").classList.remove("on");document.body.style.overflow="";}
document.getElementById("lbX").addEventListener("click",closeLb);
document.getElementById("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb();});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("lb").classList.contains("on"))return;
  if(e.key==="Escape")closeLb();
  if(e.key==="ArrowRight")setLb((I+1)%A.n);
  if(e.key==="ArrowLeft")setLb((I-1+A.n)%A.n);
});
window.addEventListener("hashchange",route);
route();
</script>
