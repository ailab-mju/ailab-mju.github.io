# ailab.mju.ac.kr — 랩 사이트 + 연구실 웹 도구
#
# 설치:  sudo cp deploy/ailab-mju.conf /etc/apache2/sites-available/
#        sudo a2ensite ailab-mju && sudo a2dissite gene_network
#        sudo systemctl reload apache2
#
# 이 파일이 기존 gene_network.conf 를 대체한다. 도구 경로(/static, /media,
# /OlinkWeb, /TFNetPropX)는 원본에서 그대로 옮겼다 — 사이트를 붙이면서
# 도구가 죽으면 안 된다.
#
# HTTPS 는 certbot 이 이 파일을 복제해 *-le-ssl.conf 를 만든다. 여기에 손으로
# SSL 지시자를 넣지 말 것 — 갱신 때마다 어긋난다.

<VirtualHost *:80>
	ServerName ailab.mju.ac.kr

	# ---------- 사이트 ----------
	# Next.js static export. 배포는 scripts/deploy-server.sh 가 rsync 한다.
	# noalcohol 소유라 배포에 sudo 가 필요 없다.
	DocumentRoot /data/project/noalcohol/site

	<Directory /data/project/noalcohol/site>
		Require all granted
		# 정적 파일만 있다. .htaccess 를 읽을 이유가 없고, 읽으면 매 요청마다
		# 디렉터리를 거슬러 올라가며 stat 을 한다.
		AllowOverride None
		Options -Indexes +FollowSymLinks
		# trailingSlash: true 로 뽑았으므로 /members/ → /members/index.html
		DirectoryIndex index.html
	</Directory>

	# out/404.html 이 Next 가 만든 404 페이지다.
	ErrorDocument 404 /404.html

	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/css text/plain
		AddOutputFilterByType DEFLATE application/javascript application/json
		AddOutputFilterByType DEFLATE image/svg+xml
		# woff2·webp·png 는 이미 압축돼 있어 다시 압축하면 CPU 만 쓴다.
	</IfModule>

	<IfModule mod_expires.c>
		ExpiresActive On
		# 파일명에 해시가 박혀 있어 내용이 바뀌면 이름이 바뀐다. 영구 캐시해도 된다.
		<LocationMatch "^/_next/static/">
			ExpiresDefault "access plus 1 year"
			Header set Cache-Control "public, max-age=31536000, immutable"
		</LocationMatch>
		# HTML 은 매번 확인한다. 안 그러면 배포해도 옛 화면이 남는다.
		<LocationMatch "\.html$">
			ExpiresDefault "access plus 0 seconds"
			Header set Cache-Control "no-cache"
		</LocationMatch>
		<LocationMatch "^/images/">
			ExpiresDefault "access plus 30 days"
		</LocationMatch>
	</IfModule>

	# ---------- 연구실 웹 도구 ----------
	# 아래는 gene_network.conf 에서 그대로 옮긴 것이다. 앞으로 도구를 늘리면
	# 이 블록에 Alias / ProxyPass 를 추가한다.

	Alias /static /data/project/noalcohol/web_tool/gene_network/static
	<Directory /data/project/noalcohol/web_tool/gene_network/static>
		Require all granted
	</Directory>

	Alias /media /data/project/noalcohol/web_tool/gene_network/media
	<Directory /data/project/noalcohol/web_tool/gene_network/media>
		Require all granted
	</Directory>

	<Directory /data/project/noalcohol/web_tool/gene_network/data_analysis>
		<Files wsgi.py>
			Require all granted
		</Files>
	</Directory>

	Alias /OlinkWeb/static /data/project/noalcohol/web_tool/olink/static
	<Directory /data/project/noalcohol/web_tool/olink/static>
		Require all granted
	</Directory>

	Alias /OlinkWeb/media /data/project/noalcohol/web_tool/olink/media
	<Directory /data/project/noalcohol/web_tool/olink/media>
		Require all granted
	</Directory>

	<Directory /data/project/noalcohol/web_tool/olink/data_analysis>
		<Files wsgi.py>
			Require all granted
		</Files>
	</Directory>

	ProxyPass        /TFNetPropX/ http://127.0.0.1:9001/TFNetPropX/
	ProxyPassReverse /TFNetPropX/ http://127.0.0.1:9001/TFNetPropX/
	ProxyPass        /OlinkWeb/   http://127.0.0.1:8999/OlinkWeb/
	ProxyPassReverse /OlinkWeb/   http://127.0.0.1:8999/OlinkWeb/

	SetEnv LANG en_US.UTF-8

	ErrorLog  ${APACHE_LOG_DIR}/ailab-error.log
	CustomLog ${APACHE_LOG_DIR}/ailab-access.log combined
</VirtualHost>
